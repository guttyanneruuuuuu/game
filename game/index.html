<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0014" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>ORBITAL SLASH — 軌道斬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --c1:#7df9ff; --c2:#ff4dd6; --c3:#a06bff; --c4:#ffd84d;
    --bg0:#05030f; --bg1:#0a0420; --glass: rgba(20,10,40,0.45);
    --glass-b: rgba(255,255,255,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg0);color:#fff;font-family:'Noto Sans JP','Orbitron',sans-serif;touch-action:none;overscroll-behavior:none;}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
  #gameRoot{position:fixed;inset:0;}

  /* ===== Loading ===== */
  #loader{position:fixed;inset:0;background:radial-gradient(ellipse at center, #1a0a3a 0%, #05030f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:opacity .8s;}
  #loader .ring{width:120px;height:120px;border-radius:50%;border:3px solid transparent;border-top-color:var(--c1);border-right-color:var(--c2);animation:spin 1.2s linear infinite;box-shadow:0 0 40px var(--c1), inset 0 0 40px rgba(125,249,255,.3);}
  #loader .lbl{margin-top:24px;font-family:'Orbitron';letter-spacing:.4em;font-size:14px;color:var(--c1);text-shadow:0 0 20px var(--c1);}
  #loader .pct{margin-top:8px;font-family:'Orbitron';font-size:11px;color:#fff8;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== Title ===== */
  #title{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  #title.hidden{opacity:0;pointer-events:none;transition:opacity .6s;}
  .title-bg{position:absolute;inset:0;background:
    radial-gradient(ellipse at 30% 20%, rgba(125,249,255,.18), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(255,77,214,.18), transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(160,107,255,.10), transparent 60%);
    pointer-events:none;}
  .logo{font-family:'Orbitron';font-weight:900;font-size:clamp(36px,9vw,72px);letter-spacing:.06em;
    background:linear-gradient(120deg,#fff 0%,var(--c1) 30%,var(--c2) 70%,#fff 100%);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite;text-shadow:0 0 0 transparent;
    filter:drop-shadow(0 0 16px rgba(125,249,255,.6)) drop-shadow(0 0 30px rgba(255,77,214,.3));
    pointer-events:none;text-align:center;line-height:1;}
  @keyframes shine{to{background-position:300% 0;}}
  .logo-jp{font-family:'Noto Sans JP';font-weight:900;font-size:clamp(14px,3.6vw,22px);letter-spacing:.6em;color:#fff;opacity:.85;margin-top:6px;text-shadow:0 0 12px var(--c3);}
  .tagline{margin-top:18px;font-size:clamp(11px,2.6vw,14px);color:#fff9;letter-spacing:.2em;text-align:center;max-width:90%;line-height:1.6;}
  .start-btn{margin-top:36px;pointer-events:auto;
    padding:16px 38px;font-family:'Orbitron';font-weight:700;font-size:16px;letter-spacing:.3em;
    color:#fff;background:linear-gradient(135deg,rgba(125,249,255,.25),rgba(255,77,214,.25));
    border:1px solid rgba(255,255,255,.4);border-radius:50px;
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 8px 32px rgba(125,249,255,.3),inset 0 1px 0 rgba(255,255,255,.3);
    cursor:pointer;transition:transform .2s, box-shadow .2s;}
  .start-btn:hover,.start-btn:active{transform:scale(1.05);box-shadow:0 12px 40px rgba(255,77,214,.5),inset 0 1px 0 rgba(255,255,255,.4);}
  .start-hint{margin-top:18px;font-size:11px;color:#fff7;letter-spacing:.2em;}
  .modes{margin-top:22px;display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:92vw;}
  .mode-chip{padding:8px 14px;font-size:11px;letter-spacing:.18em;color:#fff;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);
    border-radius:30px;backdrop-filter:blur(8px);cursor:pointer;transition:all .2s;}
  .mode-chip.active{background:linear-gradient(135deg,rgba(125,249,255,.4),rgba(255,77,214,.4));border-color:#fff;box-shadow:0 0 20px rgba(125,249,255,.4);}

  /* ===== HUD ===== */
  #hud{position:fixed;inset:0;z-index:50;pointer-events:none;}
  #hud.hidden{display:none;}
  .hud-top{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;align-items:flex-start;}
  .panel{padding:10px 16px;background:var(--glass);border:1px solid var(--glass-b);
    border-radius:14px;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);}
  .score-lbl{font-family:'Orbitron';font-size:9px;letter-spacing:.4em;color:var(--c1);opacity:.8;}
  .score-val{font-family:'Orbitron';font-weight:900;font-size:24px;letter-spacing:.05em;color:#fff;text-shadow:0 0 12px var(--c1);line-height:1;}
  .combo{display:flex;flex-direction:column;align-items:flex-end;}
  .combo-val{font-family:'Orbitron';font-weight:900;font-size:20px;color:var(--c2);text-shadow:0 0 12px var(--c2);line-height:1;}
  .combo-lbl{font-family:'Orbitron';font-size:9px;letter-spacing:.3em;color:var(--c2);opacity:.8;}
  .multi{font-size:10px;color:var(--c4);letter-spacing:.2em;margin-top:2px;text-shadow:0 0 8px var(--c4);}

  .hp-wrap{margin-top:10px;width:140px;height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.15);}
  .hp-fill{height:100%;background:linear-gradient(90deg,#7df9ff,#a06bff,#ff4dd6);border-radius:6px;transition:width .3s;box-shadow:0 0 10px var(--c1);}

  .energy-wrap{margin-top:6px;width:140px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
  .energy-fill{height:100%;background:linear-gradient(90deg,#ffd84d,#ff8800);border-radius:4px;transition:width .15s;box-shadow:0 0 8px var(--c4);}

  .center-msg{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron';font-weight:900;
    font-size:clamp(28px,9vw,64px);letter-spacing:.04em;
    background:linear-gradient(135deg,#fff,var(--c2),var(--c1));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px var(--c2));opacity:0;transition:opacity .25s, transform .25s;text-align:center;}
  .center-msg.show{opacity:1;animation:popMsg .8s ease-out;}
  @keyframes popMsg{0%{transform:translate(-50%,-50%) scale(.6);opacity:0;}30%{opacity:1;}100%{transform:translate(-50%,-30%) scale(1.2);opacity:0;}}

  .hint-bar{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    font-size:10px;color:#fff8;letter-spacing:.2em;text-align:center;padding:8px 16px;
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);border-radius:30px;backdrop-filter:blur(10px);
    pointer-events:none;}

  /* Action buttons */
  .actions{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(80px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;pointer-events:auto;}
  .act-btn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),rgba(160,107,255,.15));
    backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-size:10px;letter-spacing:.15em;color:#fff;
    cursor:pointer;transition:transform .1s;position:relative;overflow:hidden;}
  .act-btn:active{transform:scale(.92);}
  .act-btn.special{background:radial-gradient(circle at 30% 30%,rgba(255,216,77,.4),rgba(255,77,214,.25));border-color:rgba(255,216,77,.6);}
  .act-btn.disabled{opacity:.35;}
  .act-btn .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c4);clip-path:inset(0);transition:none;}

  .pause-btn{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    width:38px;height:38px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-b);
    backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;color:#fff;}

  /* ===== Pause / GameOver ===== */
  .overlay{position:fixed;inset:0;z-index:120;background:rgba(5,3,15,.7);backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-family:'Orbitron';font-weight:900;font-size:clamp(28px,8vw,52px);letter-spacing:.1em;margin:0;
    background:linear-gradient(135deg,#fff,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px var(--c2));}
  .stats{margin-top:18px;text-align:center;font-family:'Orbitron';color:#fff;letter-spacing:.15em;}
  .stats .row{margin:6px 0;font-size:13px;}
  .stats .row .v{color:var(--c1);font-size:18px;font-weight:900;margin-left:10px;text-shadow:0 0 10px var(--c1);}
  .ovbtns{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .ovbtns button{padding:12px 22px;font-family:'Orbitron';font-size:12px;letter-spacing:.2em;color:#fff;
    background:linear-gradient(135deg,rgba(125,249,255,.25),rgba(255,77,214,.25));
    border:1px solid rgba(255,255,255,.35);border-radius:30px;backdrop-filter:blur(10px);cursor:pointer;transition:transform .15s;}
  .ovbtns button:active{transform:scale(.95);}

  /* ===== Hand cam preview ===== */
  #handPreview{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(80px,env(safe-area-inset-bottom));width:96px;height:120px;
    border-radius:14px;overflow:hidden;border:1px solid rgba(125,249,255,.4);
    box-shadow:0 4px 20px rgba(0,0,0,.5);background:#000;display:none;z-index:60;pointer-events:none;}
  #handPreview.show{display:block;}
  #handPreview video, #handPreview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
  #handPreview .lab{position:absolute;top:4px;left:6px;font-size:8px;color:var(--c1);letter-spacing:.15em;font-family:'Orbitron';text-shadow:0 0 4px #000;z-index:2;}

  .swipe-trail{position:absolute;pointer-events:none;z-index:55;}

  /* Tip */
  .tip{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;font-size:10px;color:#fff8;letter-spacing:.15em;text-align:center;line-height:1.6;pointer-events:none;}

  /* mediapipe button on title */
  .toggle-row{margin-top:14px;display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:center;}
  .toggle-chip{font-size:10px;padding:7px 12px;border-radius:30px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;letter-spacing:.15em;cursor:pointer;}
  .toggle-chip.on{background:linear-gradient(135deg,rgba(125,249,255,.4),rgba(160,107,255,.4));border-color:#fff;}

  /* damage flash */
  #flash{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,30,80,.5) 100%);opacity:0;pointer-events:none;z-index:80;transition:opacity .15s;}
  #flash.on{opacity:1;}

  /* Boost ring */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:70;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);}

  /* Subtle scanlines for retro-future */
  .scan{position:fixed;inset:0;pointer-events:none;z-index:75;mix-blend-mode:overlay;opacity:.06;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.6) 0 1px, transparent 1px 3px);}

  /* Footer */
  .ftr{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:9px;color:#fff5;letter-spacing:.2em;pointer-events:none;}
</style>
</head>
<body>

<div id="gameRoot">
  <canvas id="cv"></canvas>
  <div class="scan"></div>
  <div id="vignette"></div>
  <div id="flash"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div>
        <div class="panel">
          <div class="score-lbl">SCORE</div>
          <div class="score-val" id="score">0</div>
          <div class="hp-wrap"><div class="hp-fill" id="hp" style="width:100%"></div></div>
          <div class="energy-wrap"><div class="energy-fill" id="energy" style="width:0%"></div></div>
        </div>
      </div>
      <div class="combo">
        <div class="panel" style="text-align:right;">
          <div class="combo-lbl">COMBO</div>
          <div class="combo-val" id="combo">x0</div>
          <div class="multi" id="multi">PHASE 1</div>
        </div>
      </div>
    </div>

    <div class="pause-btn" id="pauseBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </div>

    <div class="center-msg" id="centerMsg"></div>

    <div class="actions">
      <div class="act-btn special disabled" id="burstBtn"><div class="ring"></div>BURST</div>
      <div class="act-btn" id="dashBtn">DASH</div>
    </div>

    <div class="hint-bar" id="hintBar">スワイプで斬撃 ・ 端末を傾けて重力 ・ 二本指で時間減速</div>
  </div>

  <div id="handPreview"><span class="lab">HAND TRACK</span><video id="handVideo" playsinline muted></video><canvas id="handCv"></canvas></div>

  <!-- Title -->
  <div id="title">
    <div class="title-bg"></div>
    <div class="logo">ORBITAL SLASH</div>
    <div class="logo-jp">軌  道  斬</div>
    <div class="tagline">無限軌道を駆け、光の核を斬り続けろ。<br>傾け、滑らせ、止めて、解き放て。</div>
    <button class="start-btn" id="startBtn">START</button>
    <div class="modes" id="modes">
      <div class="mode-chip active" data-mode="endless">∞ ENDLESS</div>
      <div class="mode-chip" data-mode="rush">⚡ RUSH</div>
      <div class="mode-chip" data-mode="zen">☯ ZEN</div>
    </div>
    <div class="toggle-row">
      <div class="toggle-chip" id="gyroChip">GYRO</div>
      <div class="toggle-chip" id="handChip">HAND-CAM</div>
      <div class="toggle-chip on" id="audioChip">AUDIO</div>
    </div>
    <div class="start-hint">スマホ：スワイプで斬る ・ 傾けて移動 ・ 二本指タップで時間減速</div>
    <div class="ftr">© ORBITAL SLASH — flow forever</div>
  </div>

  <!-- Pause / GameOver overlay -->
  <div class="overlay" id="overlay">
    <h2 id="ovTitle">PAUSED</h2>
    <div class="stats">
      <div class="row">SCORE<span class="v" id="ovScore">0</span></div>
      <div class="row">MAX COMBO<span class="v" id="ovCombo">0</span></div>
      <div class="row">PHASE<span class="v" id="ovPhase">1</span></div>
    </div>
    <div class="ovbtns">
      <button id="resumeBtn">RESUME</button>
      <button id="restartBtn">RESTART</button>
      <button id="titleBtn">TITLE</button>
    </div>
  </div>

  <!-- Loading -->
  <div id="loader"><div class="ring"></div><div class="lbl">LOADING ORBIT</div><div class="pct" id="lpct">0%</div></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

// ============================================================
//  ORBITAL SLASH — Endless 3D Action
//  Concept: Surf an infinite gravity-bent corridor in space.
//   Slash the singing cores with swipes. Tilt your phone to
//   warp gravity. Two-finger pinch to slow time. MediaPipe hand
//   tracking optional for desktop / camera devices.
// ============================================================

const $ = (s)=>document.querySelector(s);
const loader = $('#loader');
const lpct = $('#lpct');
const titleEl = $('#title');
const hud = $('#hud');
const cv = $('#cv');
const overlay = $('#overlay');
const flash = $('#flash');
const handPreview = $('#handPreview');

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07041a, 0.012);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,6);

// ---------- Postprocessing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.85, 0.18);
composer.addPass(bloom);
const fxaa = new ShaderPass(FXAAShader);
fxaa.material.uniforms['resolution'].value.set(1/window.innerWidth, 1/window.innerHeight);
composer.addPass(fxaa);

// Custom chromatic aberration + vignette pass for premium look
const grade = new ShaderPass({
  uniforms:{
    tDiffuse:{value:null}, time:{value:0}, intensity:{value:0.4},
    aberration:{value:0.0018}, vignette:{value:0.85},
    saturation:{value:1.18}
  },
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;
    uniform float time, aberration, vignette, saturation, intensity;
    varying vec2 vUv;
    vec3 sat(vec3 c, float s){ float l = dot(c, vec3(.299,.587,.114)); return mix(vec3(l), c, s); }
    void main(){
      vec2 uv = vUv;
      vec2 d = uv - 0.5;
      float a = aberration * (0.6 + length(d));
      vec3 col;
      col.r = texture2D(tDiffuse, uv + d*a).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv - d*a).b;
      // film grain
      float g = (fract(sin(dot(uv*1024.+time*.4, vec2(12.9898,78.233))) * 43758.5453) - .5) * 0.04;
      col += g;
      col = sat(col, saturation);
      // soft vignette
      float v = smoothstep(1.0, 0.3, length(d)*1.6);
      col *= mix(1.0, v, vignette*0.6);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
composer.addPass(grade);

// ---------- Lights ----------
const hemi = new THREE.HemisphereLight(0xa6c8ff, 0x100822, 0.7);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(4,8,5); scene.add(key);
const rim = new THREE.PointLight(0xff4dd6, 2.5, 60); rim.position.set(-4,3,-6); scene.add(rim);
const rim2 = new THREE.PointLight(0x7df9ff, 2.5, 60); rim2.position.set(4,2,-10); scene.add(rim2);

// ---------- Skybox: starfield + nebula ----------
function makeStarTexture(){
  const c = document.createElement('canvas'); c.width=c.height=128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(.3,'rgba(255,255,255,.6)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const starTex = makeStarTexture();
function buildStars(count, radius, size, color){
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = radius * (0.6 + Math.random()*0.4);
    const t = Math.random()*Math.PI*2;
    const p = Math.acos(2*Math.random()-1);
    pos[i*3] = r*Math.sin(p)*Math.cos(t);
    pos[i*3+1] = r*Math.sin(p)*Math.sin(t);
    pos[i*3+2] = r*Math.cos(p);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({size, map:starTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, color, sizeAttenuation:true});
  return new THREE.Points(geo, mat);
}
scene.add(buildStars(1500, 200, 0.6, 0xffffff));

// ---------- Audio (WebAudio synth — no assets) ----------
let AC = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let audioOn = true;
let musicNodes = null;

function ensureAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = audioOn?0.85:0.0; masterGain.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.32; musicGain.connect(masterGain);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(masterGain);
    startMusic();
  }catch(e){console.warn('audio fail',e);}
}

function startMusic(){
  if(!AC) return;
  // Layered ambient pad + arpeggio — generative
  const pad = AC.createOscillator(); pad.type='sawtooth';
  const padFilter = AC.createBiquadFilter(); padFilter.type='lowpass'; padFilter.frequency.value=800; padFilter.Q.value=4;
  const padGain = AC.createGain(); padGain.gain.value=0.0;
  pad.connect(padFilter); padFilter.connect(padGain); padGain.connect(musicGain);

  const sub = AC.createOscillator(); sub.type='sine'; sub.frequency.value=55;
  const subGain = AC.createGain(); subGain.gain.value=0.18;
  sub.connect(subGain); subGain.connect(musicGain);

  pad.start(); sub.start();

  const scaleNotes = [261.63,329.63,392.00,440.00,523.25,659.25, 783.99]; // C E G A C E G
  let arpIdx = 0;
  const interval = setInterval(()=>{
    if(!AC) return;
    const f = scaleNotes[arpIdx%scaleNotes.length] * (1 + Math.floor(arpIdx/scaleNotes.length)%2);
    arpIdx++;
    const o = AC.createOscillator(); o.type='triangle'; o.frequency.value=f;
    const g = AC.createGain(); g.gain.value=0;
    const filt = AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=2200;
    o.connect(filt); filt.connect(g); g.connect(musicGain);
    const t = AC.currentTime;
    g.gain.linearRampToValueAtTime(0.13, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.4);
    o.start(t); o.stop(t+0.45);
    // slow filter LFO on pad
    padFilter.frequency.setValueAtTime(600 + 400*Math.sin(t*0.3), t);
    padGain.gain.setTargetAtTime(0.06 + 0.02*Math.sin(t*0.5), t, 0.5);
    pad.frequency.setValueAtTime(110 + 30*Math.sin(t*0.13), t);
  }, 250);
  musicNodes = {pad, sub, padGain, subGain, interval};
}

function sfxBlip(freq=600, dur=0.08, type='square', vol=0.6){
  if(!AC) return;
  const o = AC.createOscillator(); o.type=type; o.frequency.value=freq;
  const g = AC.createGain(); g.gain.value=0;
  const filt = AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=4000;
  o.connect(filt); filt.connect(g); g.connect(sfxGain);
  const t = AC.currentTime;
  g.gain.linearRampToValueAtTime(vol, t+0.005);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.frequency.exponentialRampToValueAtTime(freq*0.5, t+dur);
  o.start(t); o.stop(t+dur+0.02);
}
function sfxSlash(){
  if(!AC) return;
  const buf = AC.createBuffer(1, AC.sampleRate*0.18, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2); }
  const src = AC.createBufferSource(); src.buffer = buf;
  const filt = AC.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=2400; filt.Q.value=2;
  const g = AC.createGain(); g.gain.value=0.4;
  src.connect(filt); filt.connect(g); g.connect(sfxGain);
  src.start();
}

function sfxBig(){ sfxBlip(110,0.4,'sawtooth',0.7); setTimeout(()=>sfxBlip(220,0.2,'square',0.5),50); }

// Slash trail render
function drawSlashTrail(path){
  if(path.length<2) return;
  const dpr = devicePixelRatio;
  slCtx.save();
  slCtx.scale(dpr,dpr);
  slCtx.lineCap='round'; slCtx.lineJoin='round';
  slCtx.strokeStyle='rgba(255,255,255,0.95)';
  slCtx.shadowColor='#7df9ff'; slCtx.shadowBlur=24;
  slCtx.lineWidth = 6;
  slCtx.beginPath();
  slCtx.moveTo(path[0].x, path[0].y);
  for(let i=1;i<path.length;i++) slCtx.lineTo(path[i].x, path[i].y);
  slCtx.stroke();
  slCtx.strokeStyle='rgba(255,77,214,0.9)';
  slCtx.shadowColor='#ff4dd6'; slCtx.shadowBlur=18;
  slCtx.lineWidth=3;
  slCtx.beginPath();
  slCtx.moveTo(path[0].x, path[0].y);
  for(let i=1;i<path.length;i++) slCtx.lineTo(path[i].x, path[i].y);

// 3D slash hit detection: project core to screen and check if path crosses the projected point
function evaluateSlash(path){
  if(path.length<2) return;
  // total length filter
  let totalLen = 0;
  for(let i=1;i<path.length;i++){
    totalLen += Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y);
  }
  if(totalLen < 30) return; // tap, ignore
  sfxSlash();
  const w = innerWidth, h = innerHeight;
  let hits = 0;
  const hitColors = [];
  // For each core in front, project & test
  for(const c of cores){
    if(c.dead) continue;
    if(c.grp.position.z < playerGroup.position.z - 2) continue; // already past
    if(c.grp.position.z > playerGroup.position.z + 80) continue;
    const v = c.grp.position.clone().project(camera);
    const sx = (v.x*0.5+0.5)*w;
    const sy = (-v.y*0.5+0.5)*h;
    if(v.z>1) continue;
    // check distance from any segment of path
    let minD = Infinity;
    for(let i=1;i<path.length;i++){
      const d = pointSegDist(sx,sy, path[i-1].x,path[i-1].y, path[i].x,path[i].y);
      if(d<minD) minD = d;
    }
    // depth-based hitbox
    const dist = c.grp.position.distanceTo(playerGroup.position);
    const radius = Math.max(28, 220/Math.max(dist,1));
    if(minD < radius){
      hitCore(c);
      hits++;
      hitColors.push(c.color);
    }
  }
  if(hits>0){
    state.combo += hits;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    addShake(0.18 + Math.min(hits*0.08, 0.4));
    if(hits>=3){ flashMsg('TRIPLE!'); }
    else if(hits===2){ flashMsg('DOUBLE!'); }
    state.energy = Math.min(100, state.energy + hits*8);
    if(state.energy>=100 && !state.burstReady){ state.burstReady=true; flashMsg('BURST READY'); }
  }else{
    // miss
    state.combo = Math.max(0, state.combo-1);
  }
}

function pointSegDist(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay;
  const l2 = dx*dx+dy*dy;
  if(l2===0) return Math.hypot(px-ax,py-ay);
  let t = ((px-ax)*dx+(py-ay)*dy)/l2;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

function hitCore(c){
  c.hp--;
  spawnHitBurst(c.grp.position, c.color, c.type==='big'?40:22, c.type==='big'?1.4:1);
  sfxHit();
  if(c.hp<=0){
    c.dead = true;
    scene.remove(c.grp);
    const score = c.type==='big'?500: c.type==='orb'?200: c.type==='hazard'?-50:100;
    if(c.type==='hazard'){
      // hazards damage player when touched, but if slashed give no penalty
      state.score = Math.max(0, state.score + 50);
    }else{
      state.score += Math.floor(score * (1 + state.combo*0.05));
    }
    if(c.type==='big') sfxBig();
  }else{
    addShake(0.1);
  }
}

  if(useGyro){ useGyro=false; $('#gyroChip').classList.remove('on'); window.removeEventListener('deviceorientation', onOrientation); }
  else{ const ok = await enableGyro(); if(ok) $('#gyroChip').classList.add('on'); }
});
$('#audioChip').addEventListener('click', ()=>{
  audioOn = !audioOn;
  $('#audioChip').classList.toggle('on', audioOn);
  if(masterGain) masterGain.gain.value = audioOn?0.85:0.0;
});
$('#handChip').addEventListener('click', async ()=>{
  if(handOn){ stopHand(); }
  else{ await startHand(); }
});

// ---------- Reset / start ----------
function resetGame(){
  state.running=false; state.paused=false; state.gameOver=false;
  state.speed=22; state.baseSpeed=22; state.time=0; state.score=0; state.combo=0; state.maxCombo=0;
  state.hp=100; state.energy=0; state.phase=1; state.burstReady=false; state.dashCd=0; state.spawnTimer=0;
  state.gravX=0; state.gravY=0; state.slowmo=1.0; state.difficulty=1;
  // remove cores
  for(const c of cores){ scene.remove(c.grp); }
  cores.length = 0;
  // reset player
  playerGroup.position.set(0,0,0);
  playerVel.set(0,0,0);
  trailHistory.length = 0;
  // reset tunnel rings
  rings.forEach((r,i)=>{ r.position.z = -i*ringSpacing; });
  updateHud();
}
function startGame(){
  ensureAudio();
  state.running = true;
  state.paused = false;
  state.gameOver = false;
  state.mode = mode;
  if(mode==='zen'){ state.baseSpeed = 16; state.speed=16; }
  if(mode==='rush'){ state.baseSpeed = 30; state.speed=30; }
  titleEl.classList.add('hidden');
  hud.classList.remove('hidden');
}

$('#startBtn').addEventListener('click', ()=>{ resetGame(); startGame(); });

// ---------- Main loop ----------
const clock = new THREE.Clock();
const playerVel = new THREE.Vector3();
let elapsed = 0;
let frame = 0;
let lastSpawnZ = 0;

function update(dt){
  if(!state.running||state.paused) return;
  dt = Math.min(dt, 0.05);
  const sm = state.slowmo;
  const adt = dt * sm;

  state.time += adt;
  elapsed = state.time;

  // difficulty ramp
  state.difficulty = 1 + state.time*0.018;
  state.phase = Math.min(8, 1 + Math.floor(state.time/22));
  const targetSpeed = (mode==='zen'?16:mode==='rush'?30:22) + state.phase*1.6;
  state.baseSpeed += (targetSpeed - state.baseSpeed)*0.02;
  if(state.dashCd<=0) state.speed += (state.baseSpeed - state.speed)*0.05;
  state.dashCd = Math.max(0, state.dashCd - dt);

  // gravity from gyro / hand / keys
  let gx=0, gy=0;
  if(useGyro){
    gx = (gyroCurrent.gamma - gyroBase.gamma)/30;
    gy = -(gyroCurrent.beta - gyroBase.beta)/30;
  }
  if(handOn && handAvailable){
    gx = handPos.x;  // -1..1
    gy = handPos.y;
  }
  if(keys['ArrowLeft']||keys['KeyA']) gx -= 1;
  if(keys['ArrowRight']||keys['KeyD']) gx += 1;
  if(keys['ArrowUp']||keys['KeyW']) gy += 1;
  if(keys['ArrowDown']||keys['KeyS']) gy -= 1;
  state.gravX += (gx - state.gravX)*0.12;
  state.gravY += (gy - state.gravY)*0.12;

  // Player position update — within tunnel
  const accel = 18;
  playerVel.x += state.gravX * accel * dt;
  playerVel.y += state.gravY * accel * dt;
  playerVel.x *= 0.92;
  playerVel.y *= 0.92;
  playerGroup.position.x += playerVel.x * dt;
  playerGroup.position.y += playerVel.y * dt;
  // clamp inside ring (radius ~6.2)
  const r = Math.hypot(playerGroup.position.x, playerGroup.position.y);
  const rmax = 5.8;
  if(r>rmax){ const k = rmax/r; playerGroup.position.x *= k; playerGroup.position.y *= k; playerVel.multiplyScalar(0.6); }

  // tilt model
  playerGroup.rotation.z += (-state.gravX*0.5 - playerGroup.rotation.z)*0.1;
  playerGroup.rotation.x += (state.gravY*0.3 - playerGroup.rotation.x)*0.1;
  shipCore.rotation.x += dt*2; shipCore.rotation.y += dt*1.7;

  // wings flutter
  wingL.rotation.y = -0.4 + Math.sin(elapsed*4)*0.05;
  wingR.rotation.y = 0.4 - Math.sin(elapsed*4)*0.05;

  // forward motion (move world toward us)
  const forward = state.speed * adt;
  // Move tunnel rings backward (toward camera) by recycling
  for(const ring of rings){
    ring.position.z += forward;
    ring.rotation.z += dt*0.6;
    if(ring.position.z > 8){
      ring.position.z -= ringCount*ringSpacing;
    }
    // pulse rings
    const dist = ring.position.z;
    const pulse = 0.5 + 0.5*Math.sin(elapsed*2 + dist*0.1);
    ring.material.opacity = 0.25 + pulse*0.5;
  }

  // Move cores toward us; rotate slowly around tunnel axis
  for(const c of cores){
    if(c.dead) continue;
    c.grp.position.z += forward;
    // orbital motion (gravity bend) for non-hazard
    const tt = elapsed - c.t0;
    const ang = c.baseAngle + c.angVel*tt*60;
    if(c.type!=='hazard'){
      c.grp.position.x = Math.cos(ang) * c.baseR + Math.sin(elapsed+c.baseAngle)*0.2;
      c.grp.position.y = Math.sin(ang) * c.baseR + Math.cos(elapsed*0.7+c.baseAngle)*0.2;
    }
    c.mesh.rotation.x += dt*1.4;
    c.mesh.rotation.y += dt*1.1;
    c.halo.lookAt(camera.position);
    // collision with player (if not dead)
    const dx = c.grp.position.x - playerGroup.position.x;
    const dy = c.grp.position.y - playerGroup.position.y;
    const dz = c.grp.position.z - playerGroup.position.z;
    if(Math.abs(dz)<0.6 && Math.hypot(dx,dy)<0.7){
      if(c.type==='hazard'){ damage(18); spawnHitBurst(c.grp.position, 0xff2244, 30, 1.2); }
      else if(c.type==='orb'){ state.energy = Math.min(100, state.energy+30); state.score += 100; spawnHitBurst(c.grp.position, c.color, 24, 1.0); sfxHit(); }
      else { damage(10); spawnHitBurst(c.grp.position, c.color, 20, 1.0); }
      c.dead = true; scene.remove(c.grp);
      if(state.energy>=100 && !state.burstReady){ state.burstReady=true; flashMsg('BURST READY'); }
    }
    if(c.grp.position.z > 14){ c.dead=true; scene.remove(c.grp); }
  }
  // cleanup
  for(let i=cores.length-1;i>=0;i--) if(cores[i].dead) cores.splice(i,1);

  // spawn cores ahead
  state.spawnTimer -= dt;
  const spawnRate = Math.max(0.18, 0.6 - state.difficulty*0.04);
  if(state.spawnTimer<=0){
    state.spawnTimer = spawnRate * (0.7 + Math.random()*0.6);
    const baseZ = -150;
    // pattern occasionally
    const r = Math.random();
    if(r<0.06) {
      // ring of orbs
      for(let i=0;i<6;i++){
        const ang = (i/6)*Math.PI*2;
        const rad = 3.5;
        const grp = makeCoreLite('normal', new THREE.Vector3(Math.cos(ang)*rad, Math.sin(ang)*rad, baseZ));
        cores.push(grp);
      }
    } else if(r<0.12 && state.difficulty>1.4){
      spawnCore(baseZ, 'big');
    } else if(r<0.22 && state.difficulty>1.2){
      spawnCore(baseZ, 'hazard');
    } else if(r<0.30){
      spawnCore(baseZ, 'orb');
    } else {
      spawnCore(baseZ, 'normal');
      if(Math.random()<0.5) spawnCore(baseZ - 4 - Math.random()*3, 'normal');
    }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life += dt;
    const arr = p.geo.attributes.position.array;
    for(let k=0;k<p.vels.length;k++){
      arr[k*3] += p.vels[k].x * dt;
      arr[k*3+1] += p.vels[k].y * dt;
      arr[k*3+2] += p.vels[k].z * dt;
    }
    p.geo.attributes.position.needsUpdate = true;
    p.pts.material.opacity = Math.max(0, 1 - p.life/p.max);
    if(p.life>p.max){ scene.remove(p.pts); particles.splice(i,1); }
  }

  // trail history (player)
  trailHistory.push(playerGroup.position.clone().add(new THREE.Vector3(0,0,0.7)));
  if(trailHistory.length>trailLen) trailHistory.shift();
  for(let i=0;i<trailLen;i++){
    const idx = i;
    const p = trailHistory[Math.max(0, trailHistory.length - trailLen + i)] || trailHistory[trailHistory.length-1] || playerGroup.position;
    trailPos[idx*3] = p.x;
    trailPos[idx*3+1] = p.y;
    trailPos[idx*3+2] = p.z;
    const t = i/trailLen;
    trailCol[idx*3] = 0.49 + t*0.5;
    trailCol[idx*3+1] = 0.97*t;
    trailCol[idx*3+2] = 1.0 - t*0.2;
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;

  // camera follows player slightly
  const tx = playerGroup.position.x*0.5;
  const ty = 1.2 + playerGroup.position.y*0.3;
  camera.position.x += (tx - camera.position.x)*0.08;
  camera.position.y += (ty - camera.position.y)*0.08;
  camera.position.z = 5;
  camera.lookAt(playerGroup.position.x*0.6, playerGroup.position.y*0.4, -10);

  // shake
  shake.mag *= 0.88;
  camera.position.x += (Math.random()-0.5)*shake.mag*0.5;
  camera.position.y += (Math.random()-0.5)*shake.mag*0.5;

  // burst flash effect
  if(burstTime>0){
    burstTime -= dt*2.5;
    bloom.strength = 0.9 + burstTime*1.6;
  } else {
    bloom.strength += (0.9 - bloom.strength)*0.1;
  }

  // exposure pulse
  renderer.toneMappingExposure = 1.0 + Math.sin(elapsed*3)*0.04 + (state.combo*0.005);

  // rotate nebula
  nebula.rotation.y += dt*0.005;

  // shader time
  grade.uniforms.time.value = elapsed;

  // score combo decay
  if(state.combo>0 && Math.random()<0.001) state.combo = Math.max(0, state.combo-1);

  updateHud();
}

function makeCoreLite(type, position){
  // helper for ring-spawn
  const angle = Math.atan2(position.y, position.x);
  const radius = Math.hypot(position.x, position.y);
  const color = coreColors[Math.floor(Math.random()*coreColors.length)];
  const grp = new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45,0), new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.0,metalness:0.4,roughness:0.3}));
  grp.add(mesh);
  const halo = new THREE.Mesh(new THREE.RingGeometry(0.6,0.7,32), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.5, side:THREE.DoubleSide, blending:THREE.AdditiveBlending}));
  grp.add(halo);
  grp.position.copy(position);
  scene.add(grp);
  return {grp, mesh, halo, hp:1, type:'normal', color, angVel:(Math.random()-0.5)*0.04, baseAngle:angle, baseR:radius, t0:performance.now()*0.001};
}

function tick(){
  const dt = clock.getDelta();
  frame++;
  update(dt);
  composer.render();
  requestAnimationFrame(tick);
}

window.addEventListener('resize', ()=>{
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h);
  composer.setSize(w,h);
  camera.aspect = w/h; camera.updateProjectionMatrix();
  fxaa.material.uniforms['resolution'].value.set(1/w,1/h);
  resizeSlash();
});

// ---------- MediaPipe Hands (optional) ----------
let handOn = false;
let handAvailable = false;
let handPos = {x:0,y:0};
let handStream = null;
let handDetector = null;
let handVideo = null;
let handAnimReq = 0;

async function startHand(){
  try{
    // load mediapipe tasks vision
    if(!window._mpTasks){
      const mod = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/vision_bundle.mjs');
      const vision = await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm');
      handDetector = await mod.HandLandmarker.createFromOptions(vision, {
        baseOptions:{
          modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
        },
        runningMode:'VIDEO',
        numHands:1
      });
      window._mpTasks = {mod, vision, handDetector};
    } else {
      handDetector = window._mpTasks.handDetector;
    }
    handVideo = $('#handVideo');
    handStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:320, height:240}, audio:false});
    handVideo.srcObject = handStream;
    await handVideo.play();
    handPreview.classList.add('show');
    handOn = true;
    $('#handChip').classList.add('on');
    runHand();
  }catch(e){
    console.warn('hand fail', e);
    flashMsg('CAMERA UNAVAILABLE');
  }
}
function stopHand(){
  handOn = false;
  handAvailable = false;
  if(handStream){ handStream.getTracks().forEach(t=>t.stop()); handStream=null; }
  handPreview.classList.remove('show');
  $('#handChip').classList.remove('on');
  cancelAnimationFrame(handAnimReq);
}
function runHand(){
  if(!handOn) return;
  const cvH = $('#handCv');
  const ctx = cvH.getContext('2d');
  cvH.width = 96; cvH.height = 120;
  function loop(){
    if(!handOn) return;
    if(handVideo.readyState>=2){
      const ts = performance.now();
      try{
        const res = handDetector.detectForVideo(handVideo, ts);
        ctx.clearRect(0,0,cvH.width,cvH.height);
        if(res.landmarks && res.landmarks.length){
          handAvailable = true;
          const lm = res.landmarks[0];
          // index fingertip -> map to -1..1
          const tip = lm[8];
          handPos.x = (1 - tip.x)*2 - 1; // mirror
          handPos.y = -((tip.y)*2 - 1);
          // draw landmarks
          ctx.fillStyle='#7df9ff';
          for(const p of lm){
            ctx.beginPath();
            ctx.arc((1-p.x)*cvH.width, p.y*cvH.height, 2, 0, Math.PI*2);
            ctx.fill();
          }
        } else {
          handAvailable = false;
        }
      }catch(e){}
    }
    handAnimReq = requestAnimationFrame(loop);
  }
  loop();
}

// ---------- Loader fade-in ----------
let loaded = 0;
const loadInterval = setInterval(()=>{
  loaded += Math.random()*8 + 4;
  if(loaded>=100){ loaded=100; clearInterval(loadInterval); setTimeout(()=>{ loader.style.opacity=0; setTimeout(()=>loader.style.display='none', 800); }, 200); }
  lpct.textContent = Math.floor(loaded)+'%';
}, 80);

// ---------- Initial spawn for visual idle ----------
for(let i=0;i<6;i++){ spawnCore(-30 - i*12, Math.random()<0.2?'orb':'normal'); }

tick();

// expose for debugging
window.__game = {state, scene, camera, cores};
</script>
